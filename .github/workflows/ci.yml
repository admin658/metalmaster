name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ vars.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
      - name: Enable Corepack
        run: corepack enable
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r packages/api/requirements.txt
      - name: Typecheck
        run: yarn type-check:all
      - name: Lint
        run: yarn lint:all
      - name: Build
        run: yarn build
      - name: Mobile Build (EAS)
        if: ${{ env.EXPO_TOKEN != '' }}
        run: yarn workspace @metalmaster/mobile build:ci
      - name: Test
        run: yarn test:all
